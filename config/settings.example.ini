; Nyyo inbox -> CRM kit settings. setup copies this file to config/settings.ini once; edit that copy.
; Keys and tokens never go here: they go in the .env file (see INSTALL.md, Step 4).

[run]
; folder with your messages (.eml saved from your mail app, or .txt). The kit reads them, never changes them.
input_folder = inbox
output_folder = output

[ai]
; mock = built-in rules, offline and free (good for testing). openai or anthropic = your own API key in .env.
provider = mock
; leave empty for the default (openai: gpt-4.1-mini, anthropic: claude-haiku-4-5), or type another model name
model =
; below this confidence a row is flagged "needs_human"
confidence_threshold = 0.7
; yes = write a draft reply for a person to review. The kit never sends anything to your customers.
draft_replies = yes
; how draft replies are signed
business_name = The Brightway team

[send]
; Everything below is a DRY RUN until you run with --live (requests are saved in output/outbox/ instead).
; yes = add each row to your Google Sheet (needs the small Sheet script, INSTALL.md Step 6)
google_sheet = no
; none, hubspot, pipedrive or airtable (leads and quote requests with an email address only)
crm = none
; none, slack, telegram or both
alerts = none
; needs_human = alert only when a person should look · leads = leads + needs_human · all = everything except spam
alert_on = needs_human
